<!-- @dsCard group="Colors" viewport="700x120" subtitle="Quadrants du logo ADRAR — à utiliser en accents ponctuels" name="Accents du logo" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-body);">
<div style="display:flex;height:120px;">
  <div style="flex:1;background:var(--accent-blue);display:flex;align-items:flex-end;padding:8px;color:var(--text-on-dark);font:var(--text-body-sm);">--accent-blue</div>
  <div style="flex:1;background:var(--accent-amber);display:flex;align-items:flex-end;padding:8px;color:var(--text-on-light);font:var(--text-body-sm);">--accent-amber</div>
  <div style="flex:1;background:var(--accent-red);display:flex;align-items:flex-end;padding:8px;color:var(--text-on-dark);font:var(--text-body-sm);">--accent-red</div>
  <div style="flex:1;background:var(--accent-green);display:flex;align-items:flex-end;padding:8px;color:var(--text-on-dark);font:var(--text-body-sm);">--accent-green</div>
</div>
</body></html>
