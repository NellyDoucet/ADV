<!-- @dsCard group="Colors" viewport="700x180" subtitle="Fond prune + accents du logo" name="Palette principale" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-body);background:var(--color-white);">
<div style="display:flex;height:180px;">
  <div style="flex:2;background:var(--surface-app);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--text-on-dark);font:var(--text-label);">--color-plum</div>
  <div style="flex:1;background:var(--color-plum-700);display:flex;align-items:flex-end;padding:10px;color:var(--text-on-dark);font:var(--text-label);">--color-plum-700</div>
  <div style="flex:1;background:var(--color-plum-300);display:flex;align-items:flex-end;padding:10px;color:var(--text-on-dark);font:var(--text-label);">--color-plum-300</div>
  <div style="flex:1;background:var(--color-coral);display:flex;align-items:flex-end;padding:10px;color:var(--text-on-dark);font:var(--text-label);">--color-coral</div>
  <div style="flex:1;background:var(--color-paper);border-left:1px solid var(--surface-card-line);display:flex;align-items:flex-end;padding:10px;color:var(--text-on-light);font:var(--text-label);">--color-paper</div>
</div>
</body></html>
