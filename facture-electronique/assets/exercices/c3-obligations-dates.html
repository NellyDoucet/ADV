.wrap{max-width:var(--maxw);margin:0 auto;padding:20px 18px 80px}
header.top{padding:6px 0 14px;border-bottom:2px solid var(--coral);margin-bottom:12px}
header.top .kicker{color:var(--coral);font-weight:700;font-size:.82rem}
header.top h1{font-family:'Caveat Brush',cursive;font-weight:400;font-size:2.5rem;line-height:1.05;margin:.12em 0 .1em}
header.top p{color:#e7e2dd;margin:.2em 0 0;font-size:.96rem}
h2{font-family:'Caveat Brush',cursive;font-weight:400;font-size:1.8rem;margin:1.4em 0 .3em;line-height:1.1}
h2 .n{color:var(--coral)}
p{margin:.55em 0}.lead{color:#cfc8c2;font-size:.95rem;margin:.1em 0 .5em}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.explorer{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:.6em 0}
.explorer .bar{background:var(--coral);color:var(--ink);padding:8px 12px;font-size:.85rem;font-weight:700}
.frow{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-top:1px solid var(--line)}
.frow .ico{flex:none}.frow .fname{font-family:ui-monospace,Consolas,monospace;font-size:.84rem;word-break:break-all;color:#fff}
.frow .meta{margin-left:auto;color:#c9c2bc;font-size:.76rem;white-space:nowrap;padding-left:8px}
.charte{background:var(--coral);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.92rem;font-weight:600;margin:.4em 0}
.charte .mono{font-family:ui-monospace,Consolas,monospace}
.scroll{overflow-x:auto}
table.idx{width:100%;border-collapse:collapse;margin:.4em 0;font-size:.83rem}
table.idx th,table.idx td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.idx th{background:var(--coral);color:#fff;font-weight:700}table.idx td{color:#ece7e2}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:.4em}
label.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--coral);color:var(--ink);font-size:.94rem}
label.opt:hover{background:#fff}label.opt input{margin-top:3px;flex:none;accent-color:#7a2e18}
.q.correct label.opt.chosen,label.opt.chosen.ok,label.opt.ok{background:var(--ok);border-color:#2e8b57;color:#123}
.q.wrong label.opt.chosen,label.opt.chosen.ko,label.opt.ko{background:var(--ko);border-color:#b4362b;color:#3a0f0a}
label.opt.missed{outline:2px dashed var(--warn);outline-offset:1px}
.q{border-top:1px solid var(--line);padding:14px 0 4px}.q:first-of-type{border-top:none}
.q .stem{font-weight:700;margin-bottom:.5em;color:#fff}.q .ctx{color:#cfc8c2;font-size:.9rem;margin-bottom:.5em}
.vf{display:flex;gap:8px}
.vf label{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px;cursor:pointer;font-weight:700;font-size:.9rem;background:var(--panel2);color:#fff}
.vf label:hover{border-color:var(--coral)}.vf input{display:none}
.q.correct .vf label.chosen{background:var(--ok);color:#123;border-color:#2e8b57}
.q.wrong .vf label.chosen{background:var(--ko);color:#3a0f0a;border-color:#b4362b}
.row{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding:11px 0}.row:first-child{border-top:none}
.row .item{font-size:.93rem;color:#ece7e2}
select{width:100%;font-size:.94rem;padding:9px 10px;border-radius:10px;border:1.5px solid var(--coral);background:#241f1d;color:#fff}
.row.correct select{border-color:var(--ok);background:#173a2a}.row.wrong select{border-color:var(--ko);background:#3a1f1c}
.mk{font-weight:700;font-size:.85rem;margin-top:5px}.mk.ok{color:var(--ok)}.mk.ko{color:var(--ko)}
.just{font-size:.86rem;color:#cfc8c2;margin-top:3px;display:none}.just.show{display:block}
button.check{margin-top:14px;background:var(--coral);color:var(--ink);border:none;border-radius:10px;padding:12px 20px;font-size:.96rem;font-weight:700;cursor:pointer;width:100%;font-family:Ubuntu,sans-serif}
.result{margin-top:12px;padding:11px 14px;border-radius:10px;font-weight:600;display:none}
.result.show{display:block}.result.good{background:rgba(139,214,160,.18);color:var(--ok);border:1px solid var(--ok)}
.result.mid{background:var(--panel2);color:#fff;border:1px solid var(--line)}
footer{margin-top:30px;color:#c9c2bc;font-size:.85rem;text-align:center}

 else if(e.type==='multi'){e.items.forEach(function(q,j){var o=q.opts.map(function(op,k){return '<label class="opt" id="o-'+i+'-'+j+'-'+k+'"><input type="checkbox" value="'+k+'"><span>'+op.t+'</span></label>';}).join('');h+='<div class="q" id="q-'+i+'-'+j+'"><div class="stem">'+q.q+'</div><div class="opts">'+o+'</div><div class="mk" id="mk-'+i+'-'+j+'"></div></div>';});}
 b.innerHTML=h;}
function check(i){var e=EX[i],s=0,tot=0;
 if(e.type==='mcq'){e.items.forEach(function(q,j){tot++;var c=document.querySelector('input[name="q-'+i+'-'+j+'"]:checked');var box=el('q-'+i+'-'+j+'');box.classList.remove('correct','wrong');q.opts.forEach(function(_,k){el('o-'+i+'-'+j+'-'+k).classList.remove('chosen');});if(c)el('o-'+i+'-'+j+'-'+c.value).classList.add('chosen');var mk=el('mk-'+i+'-'+j+'');if(c&&+c.value===q.ok){box.classList.add('correct');mk.className='mk ok';mk.textContent='Correct. '+(q.fb||'');s++;}else{box.classList.add('wrong');mk.className='mk ko';mk.textContent='Reponse : '+q.opts[q.ok]+'. '+(q.fb||'');}});}
 else if(e.type==='tf'){e.items.forEach(function(q,j){tot++;var c=document.querySelector('input[name="q-'+i+'-'+j+'"]:checked');var box=el('q-'+i+'-'+j+'');box.classList.remove('correct','wrong');['V','F'].forEach(function(v){el('o-'+i+'-'+j+'-'+v).classList.remove('chosen');});if(c)el('o-'+i+'-'+j+'-'+c.value).classList.add('chosen');var good=c&&((c.value==='V')===q.ok);var mk=el('mk-'+i+'-'+j+'');if(good){box.classList.add('correct');mk.className='mk ok';mk.textContent='Correct.';s++;}else{box.classList.add('wrong');mk.className='mk ko';mk.textContent='Reponse : '+(q.ok?'Vrai':'Faux')+'.';}el('j-'+i+'-'+j+'').classList.add('show');});}
 else if(e.type==='match'){e.rows.forEach(function(r,j){tot++;var sel=el('sel-'+i+'-'+j+'');var box=el('q-'+i+'-'+j+'');box.classList.remove('correct','wrong');var mk=el('mk-'+i+'-'+j+'');if(sel.value===String(r.ok)){box.classList.add('correct');mk.className='mk ok';mk.textContent='Correct.';s++;}else{box.classList.add('wrong');mk.className='mk ko';mk.textContent='Attendu : '+e.labels[r.ok]+'.';}});}
 else if(e.type==='multi'){e.items.forEach(function(q,j){tot++;var box=el('q-'+i+'-'+j+'');var good=0,bad=0;q.opts.forEach(function(op,k){var lab=el('o-'+i+'-'+j+'-'+k);var cb=lab.querySelector('input');lab.classList.remove('chosen','ok','ko','missed');if(cb.checked){lab.classList.add('chosen');lab.classList.add(op.ok?'ok':'ko');if(op.ok)good++;else bad++;}else if(op.ok){lab.classList.add('missed');}});var need=q.opts.filter(function(o){return o.ok;}).length;var mk=el('mk-'+i+'-'+j+'');if(good===need&&bad===0){box.classList.add('correct');mk.className='mk ok';mk.textContent='Correct. '+(q.fb||'');s++;}else{box.classList.add('wrong');mk.className='mk ko';mk.textContent='Pas tout a fait. '+(q.fb||'');}});}
 showRes('res-'+i+'',s,tot);}
render();
el('exos').addEventListener('click',function(ev){var b=ev.target.closest('.check');if(b)check(+b.getAttribute('data-i'));});
