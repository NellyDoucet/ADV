<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration des ventes - ADRAR Formation</title>
<link rel="icon" href="assets/adrar-formation-logo.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="gate-overlay" id="global-gate" hidden>
  <div class="gate-card">
    <img class="gate-card__logo" src="assets/adrar-formation-logo.png" alt="ADRAR Formation">
    <h1 class="gate-card__title">Administration des ventes</h1>
    <p class="gate-card__text">Entrez le code communiqué par votre formateur pour commencer le module.</p>
    <form class="gate-card__form" id="global-gate-form">
      <input type="text" inputmode="numeric" class="gate-input" id="global-gate-input" placeholder="Code" autocomplete="off" aria-label="Code d'ouverture du module">
      <button type="submit" class="btn btn-primary">Valider</button>
    </form>
    <p class="gate-card__error" id="global-gate-error" hidden>Code incorrect, réessayez.</p>
  </div>
</div>

<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar">
    <div class="sidebar-brand">
      <img src="assets/adrar-formation-logo.png" alt="ADRAR Formation">
      <span class="sidebar-brand__name">ADRAR Formation<br>Administration des ventes</span>
    </div>
    <nav class="sidebar-nav" aria-label="Sommaire du module">
      <ul class="sidebar-nav__list" id="sidebar-nav-list"></ul>
    </nav>
  </aside>

  <header class="app-header">
    <button type="button" class="app-header__menu-toggle" id="menu-toggle" aria-label="Ouvrir le sommaire">
      <span data-lucide="menu"></span>
    </button>
    <div>
      <div class="app-header__title">Administration des ventes</div>
      <div class="app-header__subtitle">La chaîne commerciale</div>
    </div>
    <div class="app-header__progress">
      <span class="app-header__progress-label" id="header-progress-label">Progression : 0 %</span>
      <div class="progressbar">
        <div class="progressbar__fill" id="header-progress-fill"></div>
      </div>
    </div>
  </header>

  <main class="app-main" id="app-content">
    <div class="app-main-inner">
      <div class="page">
        <p>Chargement du module...</p>
      </div>
    </div>
  </main>
</div>

<script src="js/vendor/lucide.js"></script>
<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/scorm/scorm-api.js"></script>
<script src="js/student-identity.js"></script>
<script src="js/excel-exercise.js"></script>
<script src="js/form-exercise.js"></script>
<script src="js/app.js"></script>
</body>
</html>
