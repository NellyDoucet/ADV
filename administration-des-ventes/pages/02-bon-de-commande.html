<h2>Le bon de commande</h2>
<ul class="key-points">
  <li>C'est <strong>l'accord du client</strong> vis-à-vis de l'entreprise.</li>
  <li>Peut être un devis signé (un devis accepté vaut commande et remplace le bon de commande).</li>
  <li>Il permet de vérifier la solvabilité et les quantités.</li>
</ul>
